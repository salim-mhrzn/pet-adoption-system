{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm p-4" style="background-color: rgba(255,255,255,0.9);">
        <h3 class="mb-3" style="color: #28a745;">Notification Detail</h3>
        
        <p><strong>Message:</strong> <span style="color: #2c3e50;">{{ notif.message }}</span></p>

        {% if notif.related_pet %}
            <p><strong>Pet:</strong> <span style="color: #2c3e50;">{{ notif.related_pet.name }}</span></p>
        {% endif %}

        <p><small class="text-muted">Received on {{ notif.created_at|date:"M d, Y H:i" }}</small></p>

        <a href="{% url 'home' %}" class="btn btn-secondary mt-3">Back</a>
    </div>
</div>
{% endblock %}
