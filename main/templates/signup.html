{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    .login-bg {
        background: url("{% static 'img/pic1.jpg' %}") no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: flex-end; 
        padding-right: 50px; 
    }

    .content-box {
        background: rgba(255, 255, 255, 0.92);
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        width: 400px; 
    }
</style>

<div class="login-bg">
    <div class="content-box">
        <h3 class="text-center mb-4">Sign Up</h3>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" name="username" id="username" placeholder="Enter username" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" name="email" id="email" placeholder="Enter gmail (e.g. name@gmail.com)" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
                <small class="text-muted">8+ chars, 1 Upper, 1 Lower, 1 Number.</small>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" name="confirm_password" id="confirm_password" placeholder="Confirm password" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success">Register</button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <p>Already have an account? 
                <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
