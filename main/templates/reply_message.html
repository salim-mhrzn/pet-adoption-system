{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h3>Reply to {{ message.user.username }}</h3>
    <p><strong>Original Message:</strong> {{ message.message }}</p>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="reply" class="form-label">Your Reply:</label>
            <textarea name="reply" id="reply" class="form-control" required>{{ message.reply }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Reply</button>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
