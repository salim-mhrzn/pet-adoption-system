{% extends 'base.html' %}
{% load static %}
{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}


{% block content %}
<style>
    body, html {
        height: 100%;
    }

    .login-page {
        background: url("{% static 'img/pic1.jpg' %}") no-repeat center center fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: flex-end; /* right side */
        padding-left: 50px; /* space from left edge */
    }

    .login-container {
        background: rgba(255, 255, 255, 0.9); /* semi-transparent */
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        max-width: 400px;
        width: 100%;
    }
</style>

<div class="login-page">
    <div class="login-container">
        <h3 class="text-center mb-4">Login</h3>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" name="username" id="username" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <p>Don't have an account? 
                <a href="{% url 'signup' %}" class="btn btn-outline-success btn-sm">Sign Up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
